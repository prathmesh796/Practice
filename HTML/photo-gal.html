<!DOCTYPE html>

<html>
    <head>
        <title>Photo Gallery</title>
        <meta charset="UTF-8">

        <style>
            .gallary {
                display: grid;
                margin: 20px;
            }

            .img {
                width: 100px;
                height: 70px;
                margin: 10px;
                cursor: pointer;
            }

            .img-display {
                margin: 20px;
            }

            .selected-img {
                width: 500px;
                height: 400px;
            }
        </style>
    </head>

    <body>
        <div class="gallary">
            <img src="https://www.digitalmarketingmaterial.com/wp-content/uploads/2023/09/website-image.jpg" alt="" class="img">
            <img src="https://tse3.mm.bing.net/th/id/OIP.7QZnFd6YuY7tfLlJCpaUeAHaE7?rs=1&pid=ImgDetMain&o=7&rm=3" alt="" class="img">
            <img src="https://tse1.mm.bing.net/th/id/OIP.9vOOKixBrVZtHN2lmZTLRQHaFN?rs=1&pid=ImgDetMain&o=7&rm=3" alt="" class="img">
            <img src="https://www.addictivetips.com/app/uploads/2020/02/brave-browser-1-e1581497656639.jpg" alt="" class="img">
        </div>

        <div class="img-display">
            <img src="" alt="" id="selected-img">
        </div>

        <script>
            document.querySelectorAll('.img').forEach(img => {
                img.addEventListener('click', function() {
                    console.log(this.src);
                    document.getElementById('selected-img').src = this.src;
                })
            })
        </script>
    </body>
</html>
